name: Validate app

on:
  pull_request:
  push:
    branches: [main, 'arena/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 -m py_compile scripts/build_facilities.py scripts/build_lampposts.py
