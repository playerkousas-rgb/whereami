name: Update bundled facilities

on:
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * 1'
  push:
    branches: ['arena/01a0f182-whereami']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate official data
        run: |
          python3 scripts/build_facilities.py
          python3 scripts/build_lampposts.py
      - name: Commit only a validated change
        run: |
          git config user.name 'whereami-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/facilities.json public/data/lampposts
          git diff --cached --quiet || git commit -m 'data: update validated facility database'
          git push
